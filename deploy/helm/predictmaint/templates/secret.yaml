{{- /*
Secrets are external by design. This template only documents the contract:
a Secret named .Values.existingSecret must exist in the release namespace
with env-var-named keys, e.g.

  apiVersion: v1
  kind: Secret
  metadata: { name: predictmaint-secrets }
  stringData:
    POSTGRES_DSN: postgres://user:pass@postgres:5432/predictmaint?sslmode=require

Nothing is rendered here so `helm install` can never leak credentials into
release history.
*/ -}}
