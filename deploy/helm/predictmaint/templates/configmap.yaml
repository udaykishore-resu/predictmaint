apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "predictmaint.fullname" . }}
  labels:
    {{- include "predictmaint.labels" . | nindent 4 }}
data:
  HTTP_ADDR: ":{{ .Values.service.port }}"
  SERVICE_NAME: {{ include "predictmaint.name" . | quote }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
