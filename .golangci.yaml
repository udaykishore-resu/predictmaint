version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G404 # math/rand is intentional for deterministic detectors and the simulator
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errorlint, unparam]
formatters:
  enable:
    - gofmt
    - goimports
